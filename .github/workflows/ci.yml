
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # кнопка Run workflow на вкладке Actions: запустить вручную

jobs:
  # Tool action: линтер Ruff ищет ошибки в коде без запуска (синтаксис, неизвестные имена,
  # лишние импорты); pip-audit проверяет библиотеки на известные уязвимости.
  lint:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: lab2 } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install ruff pip-audit
      - name: Ruff
        run: ruff check --select E9,F .
      - name: Audit
        # только сообщить об уязвимостях, не останавливать сборку: обновление библиотек отдельная задача
        run: pip-audit -r web-ui/requirements.txt --progress-spinner off || true

  # Test action: unit- и API-тесты всех сервисов (55 штук) на SQLite в памяти, без Docker.
  test:
    needs: lint
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: lab2 } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -e libs/pad_common bcrypt pytest jinja2 python-multipart
      - run: python scripts/run_tests.py

  # Build: собрать Docker-образы всех сервисов по их Dockerfile (без RAG: он долгий и большой).
  # Проверяет, что Dockerfile-ы не сломаны. Образы никуда не загружаются.
  build:
    needs: test
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: lab2 } }
    steps:
      - uses: actions/checkout@v5
      - name: .env с тестовыми паролями (docker compose требует его даже для сборки)
        run: python3 -c "import re; open('.env','w').write(re.sub(r'change-me','ci', open('.env.example').read()))"
      - run: docker compose build auth-service catalog-service inventory-service order-service fulfillment-service notification-service gateway web-ui


  deploy-dev:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev            # на GitHub видно как развёртывание в среду dev (вкладка Environments)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Пароли для этого запуска (случайные, нигде не сохраняются)
        run: |
          pip install cryptography pytest httpx
          python lab2/scripts/init_env.py
          python lab3/scripts/make_secrets.py
      - name: Собрать образы
        working-directory: lab2
        run: docker compose build auth-service catalog-service inventory-service order-service fulfillment-service notification-service gateway web-ui
      - name: Создать кластер kind
        uses: helm/kind-action@v1
        with: { cluster_name: pad }
      - name: Загрузить образы в кластер
        run: |
          for s in auth-service catalog-service inventory-service order-service fulfillment-service notification-service gateway web-ui; do
            kind load docker-image "pad/$s:1.0.0" --name pad
          done
      - name: Развернуть (kubectl apply -k lab3/k8s)
        run: |
          kubectl apply -k lab3/k8s
          kubectl -n pad rollout status statefulset/postgres --timeout=240s
          kubectl -n pad rollout status statefulset/rabbitmq --timeout=300s
          for d in auth-service catalog-service inventory-service order-service fulfillment-service notification-service gateway web-ui; do
            kubectl -n pad rollout status deployment/$d --timeout=240s
          done
          kubectl -n pad get pods
      - name: Сквозные тесты против кластера
        run: |
          # сервисы, которые работают с событиями, должны подключиться к RabbitMQ
          for d in inventory-service order-service fulfillment-service notification-service; do
            for i in $(seq 1 60); do
              n=$(kubectl -n pad logs -l app.kubernetes.io/name=$d --tail=-1 | grep -c "connected to RabbitMQ" || true)
              want=$(kubectl -n pad get deploy $d -o jsonpath='{.spec.replicas}')
              [ "$n" -ge "$want" ] && echo "$d: $n/$want connected" && break
              sleep 3
            done
          done
          kubectl -n pad port-forward svc/gateway 8080:8000 > /dev/null 2>&1 &
          # ждём, пока gateway ответит и все 6 складских сервисов (без RAG) будут готовы,
          # включая подключение к RabbitMQ: иначе первый тест может прийти раньше системы
          python - <<'WAIT'
          import json, time, urllib.request
          need = {"auth-service", "catalog-service", "inventory-service", "order-service", "fulfillment-service", "notification-service"}
          for i in range(60):
              try:
                  st = json.load(urllib.request.urlopen("http://localhost:8080/api/status", timeout=3))
                  ready = {k for k, v in st["services"].items() if v.get("ready")}
                  if need <= ready:
                      print("ready after", i * 3, "s"); break
              except Exception as e:
                  print("waiting:", type(e).__name__)
              time.sleep(3)
          else:
              raise SystemExit("system is not ready")
          WAIT
          export E2E_BASE_URL=http://localhost:8080
          export E2E_ADMIN_PASSWORD=$(grep '^ADMIN_PASSWORD=' lab2/.env | cut -d= -f2)
          python -m pytest lab2/tests/e2e -v
      - name: Логи при ошибке
        if: failure()
        run: kubectl -n pad get pods; kubectl -n pad describe pods | tail -80; kubectl -n pad logs deploy/gateway --tail=50 || true
