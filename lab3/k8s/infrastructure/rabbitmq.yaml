# RabbitMQ 3.13 (брокер сообщений для событий order.confirmed, picking.completed и т.д.).
# StatefulSet по той же причине, что и PostgreSQL: очереди хранятся на постоянном томе, а имя
# узла RabbitMQ зависит от имени Pod-а, которое в StatefulSet постоянное (rabbitmq-0).
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels: { app.kubernetes.io/name: rabbitmq, app.kubernetes.io/part-of: pad-warehouse }
spec:
  selector: { app.kubernetes.io/name: rabbitmq }
  ports:
    - { name: amqp, port: 5672, targetPort: 5672 }          # протокол AMQP: сервисы шлют и получают события
    - { name: management, port: 15672, targetPort: 15672 }  # веб-панель: kubectl port-forward svc/rabbitmq 15672 -n pad
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  labels: { app.kubernetes.io/name: rabbitmq, app.kubernetes.io/part-of: pad-warehouse }
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: rabbitmq }
  template:
    metadata:
      labels: { app.kubernetes.io/name: rabbitmq, app.kubernetes.io/part-of: pad-warehouse }
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - { name: amqp, containerPort: 5672 }
            - { name: management, containerPort: 15672 }
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom: { secretKeyRef: { name: pad-secrets, key: RABBITMQ_USER } }
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom: { secretKeyRef: { name: pad-secrets, key: RABBITMQ_PASSWORD } }
          volumeMounts:
            - { name: data, mountPath: /var/lib/rabbitmq }
          # Готов, когда принимает соединения на порту AMQP; жив, когда отвечает на ping.
          readinessProbe:
            exec: { command: ["rabbitmq-diagnostics", "-q", "check_port_connectivity"] }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            exec: { command: ["rabbitmq-diagnostics", "-q", "ping"] }
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: 1Gi }
