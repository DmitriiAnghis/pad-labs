# PostgreSQL 16: одна копия сервера, внутри по базе и пользователю на каждый сервис (как в лабе 2).
#
# StatefulSet, а не Deployment: у Pod-а постоянное имя postgres-0 и свой том (PVC, запрос на
# постоянный диск), который переживает удаление и пересоздание Pod-а. Deployment подходит для
# сервисов без своего состояния, у которых копии взаимозаменяемы.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: { app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: pad-warehouse }
spec:
  selector: { app.kubernetes.io/name: postgres }
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels: { app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: pad-warehouse }
spec:
  serviceName: postgres
  replicas: 1                       # одна копия: репликация PostgreSQL вне рамок лабы
  selector:
    matchLabels: { app.kubernetes.io/name: postgres }
  template:
    metadata:
      labels: { app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: pad-warehouse }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - { name: postgres, containerPort: 5432 }
          env:
            # Данные в подпапке: в корне нового тома бывает служебная папка lost+found,
            # и initdb отказывается работать в непустой папке.
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: pad-secrets, key: POSTGRES_PASSWORD } }
            # Пароли пользователей сервисов нужны только скрипту первого запуска init-dbs.sh.
            - name: AUTH_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: pad-secrets, key: AUTH_DB_PASSWORD } }
            - name: CATALOG_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: pad-secrets, key: CATALOG_DB_PASSWORD } }
            - name: INVENTORY_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: pad-secrets, key: INVENTORY_DB_PASSWORD } }
            - name: ORDER_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: pad-secrets, key: ORDER_DB_PASSWORD } }
            - name: FULFILLMENT_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: pad-secrets, key: FULFILLMENT_DB_PASSWORD } }
            - name: NOTIFICATION_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: pad-secrets, key: NOTIFICATION_DB_PASSWORD } }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
          # pg_isready: стандартная утилита PostgreSQL, «принимает ли сервер соединения».
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "postgres"] }
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "postgres"] }
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
      volumes:
        - name: init
          configMap: { name: postgres-init, defaultMode: 0555 }
  # Шаблон тома: Kubernetes создаёт PVC data-postgres-0 и через StorageClass по умолчанию
  # (в Minikube это standard, папка на диске виртуальной машины) выделяет под него место.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: 1Gi }
