# ОБРАЗЕЦ того, какой объект Secret получается в кластере. Не применяется (нет в kustomization.yaml),
# реальные значения в Git не хранятся. Настоящий Secret создаётся из secrets/secrets.env.
#
# Secret хранит значения в base64 (кодирование, а не шифрование: echo ... | base64 -d вернёт
# пароль). Защита Secret-а в том, что он не лежит в Git и не вшит в образ, а доступ к нему в
# кластере можно ограничить правами (RBAC). Pod получает только те ключи, которые явно указаны
# в его Deployment (secretKeyRef), поэтому catalog-service не видит пароль базы заказов.
#
# Посмотреть ключи настоящего Secret без значений:  kubectl describe secret pad-secrets -n pad
apiVersion: v1
kind: Secret
metadata:
  name: pad-secrets
  namespace: pad
type: Opaque
stringData:                       # stringData: обычный текст, Kubernetes сам переведёт в base64
  POSTGRES_PASSWORD: "<пароль суперпользователя postgres>"
  AUTH_DB_PASSWORD: "<пароль пользователя auth>"
  CATALOG_DB_PASSWORD: "<...>"
  INVENTORY_DB_PASSWORD: "<...>"
  ORDER_DB_PASSWORD: "<...>"
  FULFILLMENT_DB_PASSWORD: "<...>"
  NOTIFICATION_DB_PASSWORD: "<...>"
  RABBITMQ_USER: "warehouse"
  RABBITMQ_PASSWORD: "<...>"
  ADMIN_PASSWORD: "<пароль администратора admin>"
  JWT_PRIVATE_KEY: "-----BEGIN PRIVATE KEY-----\\n...\\n-----END PRIVATE KEY-----"
